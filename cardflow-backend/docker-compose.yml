services:
  postgres:
    image: postgres:16-alpine
    container_name: cardflow-postgres
    environment:
      POSTGRES_DB: sample_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sample_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cardflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: cardflow-backend:local
    container_name: cardflow-api
    ports:
      - "8080:8080"
      - "10254:10254"
    volumes:
      - ./application-config:/opt/app/application-config
    env_file:
      - ./application-config/.env
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: sample_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      REDIS_ADDRS: redis:6379
      GATEWAY_TOKENS: local-test-token
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URL: http://localhost:8080/cardflow-backend/v1/drive/actions/callback
      GOOGLE_DRIVE_SCOPES: https://www.googleapis.com/auth/drive.file,https://www.googleapis.com/auth/spreadsheets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: cardflow-postgres
    environment:
      POSTGRES_DB: sample_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cardflow-backend/migrations/000001_create_sample_table.up.sql:/docker-entrypoint-initdb.d/01_sample.sql:ro
      - ./cardflow-backend/migrations/000002_create_cards_and_transactions.up.sql:/docker-entrypoint-initdb.d/02_cards.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sample_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cardflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./cardflow-backend
      dockerfile: Dockerfile
    image: cardflow-backend:latest
    container_name: cardflow-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:password@postgres:5432/sample_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./cardflow-app
      dockerfile: Dockerfile
    image: cardflow-frontend:latest
    container_name: cardflow-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_GATEWAY_URI: http://localhost:8080
      NEXT_PUBLIC_API_GATEWAY_URI: http://localhost:8080
      APP_ENV: uat
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
